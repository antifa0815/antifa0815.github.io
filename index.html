<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julius | Links</title>
    <style>
        :root {
            --bg-color: #191b22;
            --card-bg: #282c37;
            --text-color: #ffffff;
            --accent-color: #6364ff;
            --accent-hover: #5051e5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: var(--accent-color);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #8c8d99;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-card:hover {
            transform: translateY(-2px);
            background-color: var(--accent-color);
        }

        /* Mastodon-spezifisches Icon via SVG */
        .icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img">J</div>
        <h1>@julius_161</h1>
        <p>Finde mich im Fediverse</p>

        <div class="links-container">
            
            <a class="link-card" rel="me" href="https://mastodon.social/@julius_161" target="_blank">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                Mastodon Profil
            </a>

            </div>
    </div>

</body>
</html>
